name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_TYPE: t3.medium

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run basic syntax check
      run: |
        python -m py_compile app.py pdf_fill.py
        echo "Syntax check passed"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create deployment package
      run: |
        # Create necessary directories
        mkdir -p templates uploads converted
        
        # Copy templates if they exist in the repository
        if [ -d "templates" ]; then
          cp -r templates/ templates/
        fi
        
        # Create deployment archive
        tar -czf deployment.tar.gz \
          app.py \
          pdf_fill.py \
          requirements.txt \
          wsgi.py \
          templates/ \
          --exclude='*.pyc' \
          --exclude='__pycache__'

    - name: Copy files to EC2 via SCP
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "deployment.tar.gz"
        target: "/var/www/pdfapp/"
        strip_components: 1

    - name: Deploy application on EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e  # Exit on any error
          
          cd /var/www/pdfapp
          
          # Backup current deployment
          if [ -f "app.py" ]; then
            tar -czf backup_$(date +%Y%m%d_%H%M%S).tar.gz app.py pdf_fill.py templates/ || true
          fi
          
          # Extract new deployment
          tar -xzf deployment.tar.gz
          
          # Set proper permissions
          chmod -R 755 templates
          chmod 644 app.py pdf_fill.py requirements.txt wsgi.py
          
          # Create necessary directories
          mkdir -p uploads converted static instance/debug
          chmod -R 755 uploads converted static instance
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Install/update dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Install system dependencies if missing
          sudo apt-get update || true
          sudo apt-get install -y poppler-utils tesseract-ocr libtesseract-dev || true
          
          # Restart application service
          sudo systemctl daemon-reload
          sudo systemctl restart pdfapp
          sudo systemctl status pdfapp --no-pager
          
          # Test application health
          sleep 5
          curl -f http://localhost:8000/ || exit 1
          
          # Cleanup
          rm -f deployment.tar.gz
          echo "Deployment completed successfully!"
          
          # Show storage stats (if endpoint exists)
          curl http://localhost:8000/storage-stats 2>/dev/null || echo "Storage stats endpoint not available"

    - name: Verify deployment
      run: |
        echo "Deployment to EC2 instance completed successfully!"
        echo "Application URL: http://${{ secrets.EC2_HOST }}"
        echo "Deployment Time: $(date)"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'

    steps:
    - name: Check application health
      run: |
        echo "Performing health check..."
        # Add your health check logic here
        echo "Health check completed for http://${{ secrets.EC2_HOST }}"